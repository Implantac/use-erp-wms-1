name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      E2E_TENANT_A_EMAIL: ${{ secrets.E2E_TENANT_A_EMAIL }}
      E2E_TENANT_A_PASSWORD: ${{ secrets.E2E_TENANT_A_PASSWORD }}
      E2E_TENANT_B_EMAIL: ${{ secrets.E2E_TENANT_B_EMAIL }}
      E2E_TENANT_B_PASSWORD: ${{ secrets.E2E_TENANT_B_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Validate isolated E2E configuration
        id: e2e-config
        run: |
          missing=0; present=0
          for name in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY E2E_TENANT_A_EMAIL E2E_TENANT_A_PASSWORD E2E_TENANT_B_EMAIL E2E_TENANT_B_PASSWORD; do
            if [ -z "${!name}" ]; then missing=$((missing+1)); else present=$((present+1)); fi
          done
          if [ "$present" -eq 0 ]; then
            echo "::warning::Segredos E2E não configurados neste repositório — jornada de lojas NÃO executada aqui (rode TESTAR-E2E.bat no ambiente de homologação). Nenhum teste foi simulado."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          elif [ "$missing" -gt 0 ]; then
            echo "::error::Configuração E2E parcial ($missing segredo(s) ausente(s)) — corrija os secrets ou remova todos."
            exit 2
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install from committed lockfile
        if: steps.e2e-config.outputs.configured == 'true'
        run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        if: steps.e2e-config.outputs.configured == 'true'
        run: bunx playwright install --with-deps chromium
      - name: Run Playwright tests
        if: steps.e2e-config.outputs.configured == 'true'
        run: bun run e2e:critical
        env:
          BASE_URL: http://localhost:8080
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
