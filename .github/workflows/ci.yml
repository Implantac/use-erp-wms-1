# CI — provas a cada push/PR: tipos, testes unitários e o harness de banco
# (replay de migrations + 133 verificações de negócio). Se algo regredir,
# o merge fica vermelho ANTES de chegar no Lovable/cliente.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Typecheck + unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Testes unitários
        run: bun x vitest run

  harness:
    name: Harness de banco (replay + negócio)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Instalar dependências do harness
        working-directory: tests/harness
        run: bun install
      - name: Rodar harness
        working-directory: tests/harness
        run: bun harness.mjs
