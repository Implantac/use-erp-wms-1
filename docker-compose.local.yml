# ============================================================================
# USE ERP — instalação 100% LOCAL (PostgreSQL local, sem nuvem Supabase)
#
#   Instalação (Windows):  .\instalar-local.ps1
#   Manual (qualquer SO):  node docker/local/scripts/generate-env.mjs
#                          docker compose -f docker-compose.local.yml --env-file .env.local up -d db auth rest realtime storage imgproxy functions web
#                          docker compose -f docker-compose.local.yml --env-file .env.local run --rm migrate
#                          docker compose -f docker-compose.local.yml --env-file .env.local up -d
#
# Arquitetura (tudo na rede interna do Docker; só o `web` é publicado):
#   web (nginx :8080) ─┬─ /            -> frontend
#                      ├─ /rest/v1     -> rest (PostgREST)
#                      ├─ /auth/v1     -> auth (GoTrue)
#                      ├─ /realtime/v1 -> realtime
#                      ├─ /storage/v1  -> storage (+ imgproxy)
#                      └─ /functions/v1-> functions (Edge Runtime/Deno)
#   db = supabase/postgres (PostgreSQL + pg_cron + pg_net + schemas Supabase)
# Os serviços seguem as imagens/valores oficiais do repositório supabase/docker.
# ============================================================================
name: use-erp-local

x-common-env: &common-env
  POSTGRES_HOST: ${POSTGRES_HOST:-db}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_DB: ${POSTGRES_DB:-postgres}

services:
  # ------------------------------------------------------------------ banco
  db:
    container_name: useerp-db
    image: supabase/postgres:15.8.1.085
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 12
    environment:
      <<: *common-env
      # NAO definir POSTGRES_USER aqui: a imagem oficial usa supabase_admin
      # como superusuario inicial e cria o papel postgres na inicializacao.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?rode o instalador para gerar o .env.local}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-postgres}
      PGPORT: ${POSTGRES_PORT:-5432}
      JWT_EXP: ${JWT_EXPIRY:-3600}
    ports:
      # Só na própria máquina (DBeaver/psql). Não exponha na rede local.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - ./docker/local/volumes/db/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:ro
      - ./docker/local/volumes/db/webhooks.sql:/docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql:ro
      - ./docker/local/volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./docker/local/volumes/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      - ./docker/local/volumes/db/_supabase.sql:/docker-entrypoint-initdb.d/migrations/97-_supabase.sql:ro
      - ./docker/local/volumes/db/logs.sql:/docker-entrypoint-initdb.d/migrations/99-logs.sql:ro
      - ./docker/local/volumes/db/pooler.sql:/docker-entrypoint-initdb.d/migrations/99-pooler.sql:ro
      - db-data:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal

  # ------------------------------------------------------------------- auth
  auth:
    container_name: useerp-auth
    image: supabase/gotrue:v2.197.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      timeout: 5s
      interval: 5s
      retries: 6
    environment:
      <<: *common-env
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:8080}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:8080}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:-http://localhost:8080/**}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?rode o instalador para gerar o .env.local}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP:-true}
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: ${ENABLE_ANONYMOUS_USERS:-false}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM:-true}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-admin@example.com}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-localhost}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-2500}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-USE ERP Local}
      GOTRUE_MAILER_URLPATHS_INVITE: ${MAILER_URLPATHS_INVITE:-/auth/v1/verify}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: ${MAILER_URLPATHS_CONFIRMATION:-/auth/v1/verify}
      GOTRUE_MAILER_URLPATHS_RECOVERY: ${MAILER_URLPATHS_RECOVERY:-/auth/v1/verify}
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: ${MAILER_URLPATHS_EMAIL_CHANGE:-/auth/v1/verify}
      GOTRUE_EXTERNAL_PHONE_ENABLED: ${ENABLE_PHONE_SIGNUP:-false}
      GOTRUE_SMS_AUTOCONFIRM: ${ENABLE_PHONE_AUTOCONFIRM:-true}

  # ------------------------------------------------------------- API (REST)
  rest:
    container_name: useerp-rest
    image: postgrest/postgrest:v14.18
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *common-env
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public,graphql_public}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS:-1000}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH:-public}
      PGRST_DB_ANON_ROLE: anon
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY:-3600}
    command: ["postgrest"]

  # --------------------------------------------------------------- realtime
  realtime:
    # O nome precisa ser realtime-dev.* (o serviço deriva o tenant do hostname).
    container_name: realtime-dev.supabase-realtime
    image: supabase/realtime:v2.143.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sSfL --head -o /dev/null -H \"Authorization: Bearer ${ANON_KEY:-}\" http://localhost:4000/api/tenants/realtime-dev/health"]
      timeout: 5s
      interval: 30s
      retries: 3
      start_period: 15s
    environment:
      <<: *common-env
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-postgres}
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY:-supabaserealtime}
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?rode o instalador para gerar o .env.local}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      DISABLE_HEALTHCHECK_LOGGING: "true"

  # ---------------------------------------------------------------- storage
  storage:
    container_name: useerp-storage
    image: supabase/storage-api:v1.81.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
      imgproxy:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://storage:5000/status"]
      timeout: 5s
      interval: 10s
      retries: 5
      start_period: 15s
    environment:
      <<: *common-env
      ANON_KEY: ${ANON_KEY:?rode o instalador para gerar o .env.local}
      SERVICE_KEY: ${SERVICE_ROLE_KEY:?rode o instalador para gerar o .env.local}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      STORAGE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:8080}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: ${GLOBAL_S3_BUCKET:-stub}
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: ${STORAGE_TENANT_ID:-stub}
      REGION: ${REGION:-stub}
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: http://imgproxy:5001
      S3_PROTOCOL_ACCESS_KEY_ID: ${S3_PROTOCOL_ACCESS_KEY_ID:-}
      S3_PROTOCOL_ACCESS_KEY_SECRET: ${S3_PROTOCOL_ACCESS_KEY_SECRET:-}
    volumes:
      - storage-data:/var/lib/storage

  imgproxy:
    container_name: useerp-imgproxy
    image: darthsim/imgproxy:v3.31.4
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      timeout: 5s
      interval: 10s
      retries: 3
    environment:
      IMGPROXY_BIND: ":5001"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_AUTO_WEBP: ${IMGPROXY_AUTO_WEBP:-true}
      IMGPROXY_MAX_SRC_RESOLUTION: 16.8
    volumes:
      - storage-data:/var/lib/storage:ro

  # ------------------------------------------------------------ edge functions
  functions:
    container_name: useerp-functions
    build:
      context: .
      dockerfile: docker/local/functions.Dockerfile
    image: useerp-functions-local:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/9000'"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SUPABASE_URL: http://web
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:8080}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      # Sem gateway com verify_jwt por função: cada função valida o chamador
      # internamente (require-auth/requireAdmin). Ver docs/INSTALL-LOCAL.md.
      VERIFY_JWT: "${FUNCTIONS_VERIFY_JWT:-false}"
      # --- opcionais (vazio = recurso responde indisponível, sem simular) ---
      SITE_URL: ${SITE_URL:-http://localhost:8080}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      CRON_SECRET: ${CRON_SECRET:-}
      LOVABLE_API_KEY: ${LOVABLE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      INCIDENT_EMAIL_FROM: ${INCIDENT_EMAIL_FROM:-}
      COMMERCE_NOTIFY_FROM: ${COMMERCE_NOTIFY_FROM:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      BILLING_WEBHOOK_SECRET: ${BILLING_WEBHOOK_SECRET:-}
      PSP_WEBHOOK_SECRET: ${PSP_WEBHOOK_SECRET:-}
      PIX_WEBHOOK_SECRET: ${PIX_WEBHOOK_SECRET:-}
      PIX_SIMULATION_ENABLED: ${PIX_SIMULATION_ENABLED:-}
      SEFAZ_MTLS_PROXY_URL: ${SEFAZ_MTLS_PROXY_URL:-}
      SEFAZ_MTLS_PROXY_TOKEN: ${SEFAZ_MTLS_PROXY_TOKEN:-}
      SEFAZ_WEBHOOK_SECRET: ${SEFAZ_WEBHOOK_SECRET:-}
      REINF_WS_ENDPOINT: ${REINF_WS_ENDPOINT:-}
      RFID_WEBHOOK_SECRET: ${RFID_WEBHOOK_SECRET:-}
      RFID_WEBHOOK_API_KEY: ${RFID_WEBHOOK_API_KEY:-}
      BRAIN_WEBHOOK_URL: ${BRAIN_WEBHOOK_URL:-}
    volumes:
      # As funções vão DENTRO da imagem (docker/local/functions.Dockerfile):
      # bind mounts aninhados quebram no Docker Desktop/Windows.
      - deno-cache:/root/.cache/deno
    command:
      - start
      - --user-worker-request-idle-timeout
      - "150000"
      - --main-service
      - /home/deno/functions/main

  # ------------------------------------------------------ migrations (1 vez)
  migrate:
    container_name: useerp-migrate
    image: supabase/postgres:15.8.1.085
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
      storage:
        condition: service_started
      realtime:
        condition: service_started
    environment:
      <<: *common-env
      # Migrations rodam como supabase_admin (superusuario da imagem oficial,
      # mesma senha do POSTGRES_PASSWORD) — varias criam extensoes/funcoes.
      POSTGRES_USER: supabase_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      ANON_KEY: ${ANON_KEY:-}
    volumes:
      - ./supabase/migrations:/migrations:ro
      - ./docker/local/scripts/migrate.sh:/usr/local/bin/migrate.sh:ro
      - ./docker/local/scripts/00-baseline.sql:/usr/local/bin/00-baseline.sql:ro
      - ./docker/local/scripts/patches:/usr/local/bin/patches:ro
      - ./docker/local/scripts/99-local-final.sql:/usr/local/bin/99-local-final.sql:ro
    entrypoint: ["sh", "/usr/local/bin/migrate.sh"]

  # --------------------------------------------------------------------- web
  web:
    container_name: useerp-web
    build:
      context: .
      dockerfile: Dockerfile.local
    restart: unless-stopped
    volumes:
      - ./docker/local/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - rest
      - auth
      - realtime
      - storage
      - functions
    environment:
      # Injetado no /config.js pelo entrypoint (chave pública anon local).
      ANON_KEY: ${ANON_KEY:-}
    ports:
      # Única porta a liberar no Firewall do Windows para a rede local.
      - "${WEB_PORT:-8080}:80"

  # ------------------------------------------- painel do banco (OPCIONAL)
  # Subir com: docker compose -f docker-compose.local.yml --env-file .env.local --profile studio up -d
  meta:
    container_name: useerp-meta
    image: supabase/postgres-meta:v0.100.0
    restart: unless-stopped
    profiles: ["studio"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: ${POSTGRES_DB:-postgres}
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY:?rode o instalador para gerar o .env.local}

  studio:
    container_name: useerp-studio
    image: supabase/studio:2026.10.12-sha-3699278
    restart: unless-stopped
    profiles: ["studio"]
    depends_on:
      - meta
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PORT: 5432
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER_READ_WRITE: postgres
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public,graphql_public}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS:-1000}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH:-public}
      DEFAULT_ORGANIZATION_NAME: ${STUDIO_DEFAULT_ORGANIZATION:-USE ERP Local}
      DEFAULT_PROJECT_NAME: ${STUDIO_DEFAULT_PROJECT:-USE ERP}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SUPABASE_URL: http://web
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:8080}
      SUPABASE_ANON_KEY: ${ANON_KEY:-}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY:-}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      ENABLED_FEATURES_LOGS_ALL: "false"

volumes:
  db-data:
  db-config:
  storage-data:
  deno-cache:
