name: Playwright Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  public-smoke:
    name: Smoke público obrigatório
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install from committed lockfile
        run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run public login smoke
        run: bunx playwright test --config=e2e/playwright.public.config.ts
      - name: Assert non-empty complete smoke results
        run: node scripts/assert-playwright-public.mjs e2e/test-results/public-results.json
      - name: Tests did not rewrite tracked sources
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-smoke-${{ github.run_id }}
          path: e2e/test-results/
          if-no-files-found: warn
          retention-days: 7

  authenticated:
    name: Jornadas autenticadas obrigatórias
    needs: public-smoke
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      MCP_FUNCTIONS_DIR: node_modules/.cache/authenticated-e2e/supabase-functions
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      E2E_TENANT_A_EMAIL: ${{ secrets.E2E_TENANT_A_EMAIL }}
      E2E_TENANT_A_PASSWORD: ${{ secrets.E2E_TENANT_A_PASSWORD }}
      E2E_TENANT_B_EMAIL: ${{ secrets.E2E_TENANT_B_EMAIL }}
      E2E_TENANT_B_PASSWORD: ${{ secrets.E2E_TENANT_B_PASSWORD }}
      E2E_STORE_EMAIL: ${{ secrets.E2E_STORE_EMAIL }}
      E2E_STORE_PASSWORD: ${{ secrets.E2E_STORE_PASSWORD }}
      E2E_MANAGER_EMAIL: ${{ secrets.E2E_MANAGER_EMAIL }}
      E2E_MANAGER_PASSWORD: ${{ secrets.E2E_MANAGER_PASSWORD }}
      E2E_PRODUCT_ID: ${{ secrets.E2E_PRODUCT_ID }}
      E2E_STORE_BRANCH_ID: ${{ secrets.E2E_STORE_BRANCH_ID }}
      E2E_CD_BRANCH_ID: ${{ secrets.E2E_CD_BRANCH_ID }}
      E2E_WEAVING_EMAIL: ${{ secrets.E2E_WEAVING_EMAIL }}
      E2E_WEAVING_PASSWORD: ${{ secrets.E2E_WEAVING_PASSWORD }}
      E2E_WEAVING_PRODUCT_ID: ${{ secrets.E2E_WEAVING_PRODUCT_ID }}
      E2E_WEAVING_COMPONENT_ID: ${{ secrets.E2E_WEAVING_COMPONENT_ID }}
      E2E_WEAVING_LOT_ID: ${{ secrets.E2E_WEAVING_LOT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Validate isolated E2E configuration
        run: |
          missing=0
          for name in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY E2E_TENANT_A_EMAIL E2E_TENANT_A_PASSWORD E2E_TENANT_B_EMAIL E2E_TENANT_B_PASSWORD E2E_STORE_EMAIL E2E_STORE_PASSWORD E2E_MANAGER_EMAIL E2E_MANAGER_PASSWORD E2E_PRODUCT_ID E2E_STORE_BRANCH_ID E2E_CD_BRANCH_ID E2E_WEAVING_EMAIL E2E_WEAVING_PASSWORD E2E_WEAVING_PRODUCT_ID E2E_WEAVING_COMPONENT_ID E2E_WEAVING_LOT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required isolated E2E setting: $name"
              missing=$((missing+1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "::error::Authenticated E2E was NOT run. Configure an isolated test environment; missing tests are never a successful gate."
            exit 2
          fi
      - name: Install from committed lockfile
        run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run authenticated Playwright journeys
        run: bun run e2e:critical
        env:
          E2E_REQUIRE_ALL: '1'
      - name: Tests did not rewrite tracked sources
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authenticated-playwright-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7


  isolated-e2e:
    name: Ambiente E2E isolado (QA-01/QA-02/QA-03/QA-04)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - name: Instalar binários do Postgres embarcado
        working-directory: tests/harness
        run: bun install --frozen-lockfile
      - name: Jornadas isoladas QA-01/QA-02/QA-03/QA-04 sem segredos, sem skip e sem rede externa
        run: bun run e2e:isolated
      - name: Teardown garantido do ambiente isolado
        if: always()
        run: node scripts/e2e-isolated-server.mjs --teardown
      - name: Testes não regravaram fontes rastreadas
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-e2e-${{ github.run_id }}
          path: |
            playwright-report-isolated/
            test-results/
          if-no-files-found: warn
          retention-days: 7
