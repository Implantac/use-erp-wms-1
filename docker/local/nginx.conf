# USE ERP — instalação LOCAL (Docker).
# Um único ponto de entrada (porta WEB_PORT, padrão 8080) para:
#   /                -> frontend (SPA)
#   /rest/v1/        -> PostgREST      (container `rest`)
#   /auth/v1/        -> GoTrue/Auth    (container `auth`)
#   /realtime/v1/    -> Realtime       (container `realtime`, HTTP + WebSocket)
#   /storage/v1/     -> Storage        (container `storage`)
#   /functions/v1/   -> Edge Functions (container `functions`)
# Como tudo sai pela MESMA origem da página, o app usa window.location.origin
# como URL da API — funciona em localhost e pelo IP da rede local sem rebuild.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # DNS do Docker: resolve os nomes dos containers sob demanda (sobrevive a restart).
  resolver 127.0.0.11 valid=10s ipv6=off;

  client_max_body_size 50m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /healthz { access_log off; return 200 "ok\n"; }

  # Config em tempo de execução: nunca cachear (é gerada na subida do container).
  location = /config.js {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # ---------------- API Supabase local (proxy reverso) ----------------

  location /rest/v1/ {
    set $upstream rest;
    rewrite ^/rest/v1/(.*)$ /$1 break;
    proxy_pass http://$upstream:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /auth/v1/ {
    set $upstream auth;
    rewrite ^/auth/v1/(.*)$ /$1 break;
    proxy_pass http://$upstream:9999;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /realtime/v1/ {
    set $upstream realtime;
    rewrite ^/realtime/v1/(.*)$ /socket/$1 break;
    proxy_pass http://$upstream:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /storage/v1/ {
    set $upstream storage;
    rewrite ^/storage/v1/(.*)$ /$1 break;
    proxy_pass http://$upstream:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /functions/v1/ {
    set $upstream functions;
    rewrite ^/functions/v1/(.*)$ /$1 break;
    proxy_pass http://$upstream:9000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  # ---------------- Frontend (SPA) ----------------
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
